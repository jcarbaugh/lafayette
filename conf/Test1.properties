# Warm-up block of random single-colour composites, then shuffled blocks of
# blue / red / compound composites. The test blocks are unreinforced: the
# HopperAction is only attached to warm-up composites.

# VI bounds for the two colours, as in TerminalBaseline. These must differ:
# VariableInterval.reset() calls rand.nextInt(max - min), which throws when
# the two are equal.
interval_min.blue = 2000
interval_max.blue = 5000
interval_min.red = 2000
interval_max.red = 5000

# Length of the warm-up block. Overrides warmup_duration=0 in
# application.properties, which would otherwise skip the warm-up entirely and
# leave composite_min/composite_max, rest_min/rest_max and pseudo_random dead.
# Set to 0 for a quick run that goes straight to the test blocks.
warmup_duration = 60000

# Duration of a test composite, and of the rest between test composites.
composite_duration = 5000

# Warm-up composite and rest durations. Only read while the warm-up is running.
composite_min = 5000
composite_max = 5000

rest_min = 1000
rest_max = 2000

# Read from here during the warm-up only: once the warm-up ends,
# getNextComposite() overwrites both via Application.setProperty (100 and 0).
rest_probability = 100
response_correction_duration = 1000

reinforcement_duration = 1000

# true prevents the same warm-up composite appearing twice in a row.
pseudo_random = true

# Test composites shown before the session ends. loadComposites() builds 12
# per pass (4 blocks x blue/red/compound), so 12 is one full pass.
block_count = 12
